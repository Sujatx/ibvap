name: Bug
description: Something that worked according to spec now doesn't
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What the PRD/ADR/RFC says should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - p0 — breaks a core workflow
        - p1 — degrades a core workflow
        - p2 — minor / cosmetic
    validations:
      required: true
