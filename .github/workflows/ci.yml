name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # src/dvr/requirements.txt belongs to the dev CCTV rig (src/dvr/dvr.py)
        # and is installed as-is; everything else resolves through pyproject.toml
        # (ADR 0033).
        run: |
          if [ -f src/dvr/requirements.txt ]; then pip install -r src/dvr/requirements.txt; fi
          uv sync --group dev

      - name: Lint
        # src/dvr/ is the preserved dev-rig setup (CLAUDE.md rule 5) — not linted.
        run: uv run ruff check . --extend-exclude src/dvr

      - name: Test
        run: |
          if [ -d tests ] || compgen -G "**/test_*.py" > /dev/null; then
            uv run pytest
          else
            echo "No tests yet — skipping."
          fi
