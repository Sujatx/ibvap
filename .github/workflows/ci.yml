name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # requirements.txt belongs to the dev CCTV rig (dvr.py) and is installed
        # as-is; everything else resolves through pyproject.toml (ADR 0033).
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          uv sync --group dev

      - name: Lint
        # dvr.py / backups/ are the preserved dev-rig setup (CLAUDE.md rule 6) — not linted.
        run: uv run ruff check . --extend-exclude dvr.py,backups

      - name: Test
        run: |
          if [ -d tests ] || compgen -G "**/test_*.py" > /dev/null; then
            uv run pytest
          else
            echo "No tests yet — skipping."
          fi
