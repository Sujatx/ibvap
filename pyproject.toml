[project]
name = "ibvap"
version = "0.0.0"
description = "Intelligent Border Video Analytics Platform — SIH 2026, problem statement 26187"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]

# The rig's own requirements.txt (opencv-python, numpy) belongs to dvr.py and is
# preserved unmodified — CLAUDE.md rule 6. It is deliberately not mirrored here.

[tool.ruff]
target-version = "py312"
line-length = 100
# dvr.py and backups/ are the preserved dev-rig setup (CLAUDE.md rule 6).
extend-exclude = ["dvr.py", "backups"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ['dvr\.py', 'backups/']

[tool.pytest.ini_options]
testpaths = ["tests"]
